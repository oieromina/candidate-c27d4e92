name: Run Automation Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Which tests to run"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - api
          - ui
      user_id:
        description: "Candidate user id"
        required: false
        default: "candidate-c27d4e92"

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select test scope
        id: scope
        run: |
          if [ "${{ github.event.inputs.test_scope }}" == "api" ]; then
            echo "TEST_PATH=tests/api" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.test_scope }}" == "ui" ]; then
            echo "TEST_PATH=tests/ui" >> $GITHUB_ENV
          else
            echo "TEST_PATH=tests" >> $GITHUB_ENV
          fi

      - name: Run pytest
        run: |
          echo "Running tests in $TEST_PATH"
          pytest $TEST_PATH -v
